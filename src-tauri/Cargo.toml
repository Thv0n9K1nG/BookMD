[package]
name = "bookmd"
version = "0.1.0"
description = "A lightweight, filesystem-first Markdown workspace for technical notes"
authors = ["you"]
edition = "2021"

[lib]
name = "bookmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "7", features = ["macos_fsevent"] }
tokio = { version = "1", features = ["full"] }
trash = "5"
walkdir = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
